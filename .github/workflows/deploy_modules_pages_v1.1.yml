name: Deploy Module PWAs to Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Module/spectrumreader/**'
      - 'Module/LocAcc/**'
      - '.github/workflows/deploy-iphone-zip-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages tree from newest module ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _module_extract
          mkdir -p _site/Module _module_extract

          python3 - <<'PY'
          import json
          import re
          import shutil
          import zipfile
          from pathlib import Path

          SITE = Path("_site")
          EXTRACT = Path("_module_extract")

          modules = [
              {
                  "name": "Spectrum Reader",
                  "source": Path("Module/spectrumreader"),
                  "destination": SITE / "Module/spectrumreader",
                  "required": [
                      "index.html", "app.js", "styles.css", "sw.js",
                      "manifest.webmanifest", "version.json"
                  ],
              },
              {
                  "name": "LocAcc",
                  "source": Path("Module/LocAcc"),
                  "destination": SITE / "Module/LocAcc",
                  "required": [
                      "index.html", "app.js", "analysis-core.js",
                      "styles.css", "sw.js", "manifest.webmanifest",
                      "version.json"
                  ],
              },
          ]

          semver_re = re.compile(
              r"^\s*v?(\d+)\.(\d+)\.(\d+)"
              r"(?:-([0-9A-Za-z.-]+))?"
              r"(?:\+([0-9A-Za-z.-]+))?\s*$"
          )

          def parse_version(value):
              if isinstance(value, dict):
                  value = (
                      value.get("version")
                      or value.get("appVersion")
                      or value.get("app_version")
                  )
              if not isinstance(value, str):
                  return None
              m = semver_re.match(value)
              if not m:
                  return None
              major, minor, patch = map(int, m.group(1, 2, 3))
              prerelease = m.group(4)
              stable_rank = 1 if prerelease is None else 0
              return (
                  (major, minor, patch, stable_rank, prerelease or ""),
                  value.strip().lstrip("v"),
              )

          def find_app_root(archive):
              names = [n for n in archive.namelist() if not n.endswith("/")]
              versions = [n for n in names if n.endswith("version.json")]
              versions.sort(key=lambda n: (n.count("/"), len(n), n))
              for vn in versions:
                  prefix = vn[:-len("version.json")]
                  if prefix + "index.html" in names:
                      return prefix, vn
              return None, None

          deployed = []

          for module in modules:
              src = module["source"]
              if not src.is_dir():
                  raise SystemExit(
                      f"::error::{module['name']} source directory missing: {src}"
                  )

              zip_paths = sorted(
                  [p for p in src.glob("*.zip") if p.is_file()],
                  key=lambda p: p.name.lower(),
              )
              if not zip_paths:
                  raise SystemExit(f"::error::No ZIP found under {src}")

              candidates = []

              for zpath in zip_paths:
                  try:
                      with zipfile.ZipFile(zpath) as arc:
                          prefix, version_name = find_app_root(arc)
                          if version_name is None:
                              print(f"SKIP {zpath}: version.json/index.html pair missing")
                              continue

                          raw = json.loads(
                              arc.read(version_name).decode("utf-8-sig")
                          )
                          parsed = parse_version(raw)
                          if parsed is None:
                              print(f"SKIP {zpath}: unsupported version.json {raw!r}")
                              continue

                          sort_key, version = parsed
                          archive_names = set(arc.namelist())
                          missing = [
                              f for f in module["required"]
                              if prefix + f not in archive_names
                          ]
                          if missing:
                              print(
                                  f"SKIP {zpath}: missing required files "
                                  + ", ".join(missing)
                              )
                              continue

                          candidates.append((sort_key, version, zpath, prefix))
                          print(
                              f"CANDIDATE {module['name']}: "
                              f"{zpath} -> {version}"
                          )
                  except Exception as exc:
                      print(f"SKIP {zpath}: {exc}")

              if not candidates:
                  raise SystemExit(
                      f"::error::No valid {module['name']} application ZIP "
                      f"found under {src}"
                  )

              candidates.sort(key=lambda x: x[0])
              _, version, selected_zip, prefix = candidates[-1]

              print("")
              print("============================================")
              print(f"Module: {module['name']}")
              print(f"Selected ZIP: {selected_zip}")
              print(f"Selected version: {version}")
              print(f"ZIP app root: {prefix or './'}")
              print("============================================")

              extract_dir = EXTRACT / module["destination"].name
              if extract_dir.exists():
                  shutil.rmtree(extract_dir)
              extract_dir.mkdir(parents=True)

              with zipfile.ZipFile(selected_zip) as arc:
                  arc.extractall(extract_dir)

              source_root = extract_dir / prefix if prefix else extract_dir
              destination = module["destination"]

              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True)

              for item in source_root.iterdir():
                  target = destination / item.name
                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)

              version_file = destination / "version.json"
              data = json.loads(version_file.read_text(encoding="utf-8-sig"))
              actual_parsed = parse_version(data)
              if actual_parsed is None:
                  raise SystemExit(
                      f"::error::{module['name']} deployed version is unreadable"
                  )
              actual_version = actual_parsed[1]
              if actual_version != version:
                  raise SystemExit(
                      f"::error::{module['name']} version mismatch: "
                      f"{actual_version} != {version}"
                  )

              manifest = json.loads(
                  (destination / "manifest.webmanifest").read_text(
                      encoding="utf-8-sig"
                  )
              )
              if manifest.get("start_url") != "./":
                  raise SystemExit(
                      f"::error::{module['name']} manifest start_url must be './'"
                  )
              if manifest.get("scope") != "./":
                  raise SystemExit(
                      f"::error::{module['name']} manifest scope must be './'"
                  )

              marker = {
                  "module": module["name"],
                  "version": version,
                  "source_zip": str(selected_zip),
              }
              (destination / "DEPLOYED_FROM.json").write_text(
                  json.dumps(marker, indent=2) + "\n",
                  encoding="utf-8",
              )
              deployed.append(marker)

          root_html = """<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Module Apps</title>
</head>
<body>
  <h1>Module Apps</h1>
  <ul>
    <li><a href="./Module/spectrumreader/">Spectrum Reader</a></li>
    <li><a href="./Module/LocAcc/">LocAcc</a></li>
  </ul>
</body>
</html>
"""
          (SITE / "index.html").write_text(root_html, encoding="utf-8")
          (SITE / "DEPLOYED_MODULES.json").write_text(
              json.dumps(deployed, indent=2) + "\n",
              encoding="utf-8",
          )

          print("")
          print("Final deployed modules:")
          print(json.dumps(deployed, indent=2))
          PY

          touch _site/.nojekyll

      - name: Verify final Pages tree
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "_site/index.html"

            "_site/Module/spectrumreader/index.html"
            "_site/Module/spectrumreader/app.js"
            "_site/Module/spectrumreader/styles.css"
            "_site/Module/spectrumreader/sw.js"
            "_site/Module/spectrumreader/manifest.webmanifest"
            "_site/Module/spectrumreader/version.json"

            "_site/Module/LocAcc/index.html"
            "_site/Module/LocAcc/app.js"
            "_site/Module/LocAcc/analysis-core.js"
            "_site/Module/LocAcc/styles.css"
            "_site/Module/LocAcc/sw.js"
            "_site/Module/LocAcc/manifest.webmanifest"
            "_site/Module/LocAcc/version.json"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required Pages file missing: $file"
              exit 1
            fi
          done

          echo "Final Pages tree:"
          find _site -maxdepth 3 -type f | sort
          echo "Pages tree verification: PASS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment URLs
        shell: bash
        run: |
          echo "Pages root: ${{ steps.deployment.outputs.page_url }}"
          echo "Spectrum Reader: ${{ steps.deployment.outputs.page_url }}Module/spectrumreader/"
          echo "LocAcc: ${{ steps.deployment.outputs.page_url }}Module/LocAcc/"
