name: Build LocAcc PWA

on:
  workflow_dispatch:
  push:
    paths:
      - 'Module/LocAcc/**'
      - '.github/workflows/build_locacc.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest LocAcc source by version.json
        id: select
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          import zipfile
          from pathlib import Path

          root = Path("Module/LocAcc")
          zips = sorted(root.glob("LocAcc*_SOURCE.zip"))

          if not zips:
              raise SystemExit("::error::No Module/LocAcc/LocAcc*_SOURCE.zip found.")

          semver_re = re.compile(
              r"^\s*v?(\d+)\.(\d+)\.(\d+)"
              r"(?:-([0-9A-Za-z.-]+))?"
              r"(?:\+([0-9A-Za-z.-]+))?\s*$"
          )

          def normalize_version(value):
              if isinstance(value, dict):
                  for key in ("version", "appVersion", "app_version"):
                      if key in value:
                          value = value[key]
                          break

              if not isinstance(value, str):
                  return None

              m = semver_re.match(value)
              if not m:
                  return None

              major, minor, patch = map(int, m.group(1, 2, 3))
              prerelease = m.group(4)

              # Stable release sorts after prerelease with the same numeric version.
              stable_rank = 1 if prerelease is None else 0
              pre_key = prerelease or ""

              return {
                  "raw": value.strip().lstrip("v"),
                  "sort": (major, minor, patch, stable_rank, pre_key),
              }

          candidates = []

          for z in zips:
              try:
                  with zipfile.ZipFile(z) as archive:
                      version_names = [
                          n for n in archive.namelist()
                          if n.rstrip("/").endswith("version.json")
                          and not n.endswith("/")
                      ]

                      if not version_names:
                          print(f"SKIP {z}: version.json missing")
                          continue

                      # Prefer version.json closest to ZIP root.
                      version_names.sort(key=lambda n: (n.count("/"), len(n), n))
                      version_name = version_names[0]

                      data = json.loads(
                          archive.read(version_name).decode("utf-8-sig")
                      )
                      parsed = normalize_version(data)

                      if parsed is None:
                          print(f"SKIP {z}: unsupported version.json = {data!r}")
                          continue

                      # Verify the same application root also contains index.html.
                      prefix = version_name[:-len("version.json")]
                      index_name = prefix + "index.html"
                      if index_name not in archive.namelist():
                          print(
                              f"SKIP {z}: index.html not found beside "
                              f"{version_name}"
                          )
                          continue

                      candidates.append(
                          (parsed["sort"], parsed["raw"], z, prefix)
                      )
                      print(
                          f"CANDIDATE {z} -> version {parsed['raw']} "
                          f"(root='{prefix or './'}')"
                      )

              except Exception as exc:
                  print(f"SKIP {z}: {exc}")

          if not candidates:
              raise SystemExit(
                  "::error::No valid LocAcc SOURCE ZIP with a readable "
                  "version.json and index.html was found."
              )

          candidates.sort(key=lambda x: x[0])
          _, version, selected_zip, app_prefix = candidates[-1]

          print("")
          print("============================================")
          print(f"Selected ZIP: {selected_zip}")
          print(f"Selected version: {version}")
          print(f"Application root in ZIP: {app_prefix or './'}")
          print("============================================")

          Path("/tmp/locacc_selected_zip.txt").write_text(
              str(selected_zip), encoding="utf-8"
          )
          Path("/tmp/locacc_selected_version.txt").write_text(
              version, encoding="utf-8"
          )
          Path("/tmp/locacc_app_prefix.txt").write_text(
              app_prefix, encoding="utf-8"
          )
          PY

          ZIP="$(cat /tmp/locacc_selected_zip.txt)"
          VERSION="$(cat /tmp/locacc_selected_version.txt)"
          PREFIX="$(cat /tmp/locacc_app_prefix.txt)"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          rm -rf _extract _site
          mkdir -p _extract _site/Module/LocAcc

          unzip -q "$ZIP" -d _extract

          if [ -n "$PREFIX" ]; then
            SRC="_extract/${PREFIX%/}"
          else
            SRC="_extract"
          fi

          if [ ! -f "$SRC/index.html" ]; then
            echo "::error::Selected application root does not contain index.html: $SRC"
            exit 1
          fi

          cp -a "$SRC"/. _site/Module/LocAcc/
          touch _site/.nojekyll

      - name: Verify deployed version exactly matches selected ZIP
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.select.outputs.version }}
          SELECTED_ZIP: ${{ steps.select.outputs.zip }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"].strip().lstrip("v")
          root = Path("_site/Module/LocAcc")
          path = root / "version.json"

          if not path.exists():
              raise SystemExit("::error::Published version.json is missing.")

          data = json.loads(path.read_text(encoding="utf-8-sig"))

          if isinstance(data, dict):
              actual = (
                  data.get("version")
                  or data.get("appVersion")
                  or data.get("app_version")
              )
          else:
              actual = data

          if not isinstance(actual, str):
              raise SystemExit(
                  f"::error::Published version.json has no readable version: {data!r}"
              )

          actual = actual.strip().lstrip("v")

          print("============================================")
          print(f"Selected ZIP: {os.environ['SELECTED_ZIP']}")
          print(f"Expected version: {expected}")
          print(f"Published version: {actual}")
          print("============================================")

          if actual != expected:
              raise SystemExit(
                  f"::error::Version mismatch: expected {expected}, published {actual}"
              )

          required = [
              "index.html",
              "app.js",
              "analysis-core.js",
              "styles.css",
              "manifest.webmanifest",
              "sw.js",
              "version.json",
          ]

          missing = [f for f in required if not (root / f).is_file()]
          if missing:
              raise SystemExit(
                  "::error::Missing required published files: "
                  + ", ".join(missing)
              )

          print("Published version verification: PASS")
          PY

      - name: Validate relative PWA paths
        shell: bash
        run: |
          set -euo pipefail

          ROOT="_site/Module/LocAcc"

          if ! grep -Eq 'rel=["'\'']manifest["'\''][^>]*href=["'\'']\./manifest\.webmanifest["'\'']|href=["'\'']\./manifest\.webmanifest["'\''][^>]*rel=["'\'']manifest["'\'']' "$ROOT/index.html"; then
            echo "::error::index.html does not reference ./manifest.webmanifest"
            exit 1
          fi

          if ! grep -Eq "serviceWorker\.register\([[:space:]]*['\"]\./sw\.js['\"]" "$ROOT/app.js"; then
            echo "::error::app.js does not register ./sw.js"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site/Module/LocAcc")
          manifest = json.loads(
              (root / "manifest.webmanifest").read_text(encoding="utf-8-sig")
          )

          if manifest.get("start_url") != "./":
              raise SystemExit("::error::manifest start_url must be './'")
          if manifest.get("scope") != "./":
              raise SystemExit("::error::manifest scope must be './'")

          print("PWA relative path validation: PASS")
          PY

      - name: Write deployed build marker
        shell: bash
        env:
          VERSION: ${{ steps.select.outputs.version }}
          ZIP: ${{ steps.select.outputs.zip }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          marker = {
              "version": os.environ["VERSION"],
              "source_zip": os.environ["ZIP"],
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
          }

          Path("_site/Module/LocAcc/build-info.json").write_text(
              json.dumps(marker, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(marker, indent=2))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}Module/LocAcc/
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        shell: bash
        run: |
          echo "LocAcc deployed."
          echo "Base Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo "LocAcc URL: ${{ steps.deployment.outputs.page_url }}Module/LocAcc/"
