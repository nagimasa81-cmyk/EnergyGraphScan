name: Deploy EnergyGraphScan + Spectrum Reader to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Module/spectrumreader/**'
      - '.github/workflows/deploy-spectrumreader-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the Pages artifact directly from the repository.
      # Module/spectrumreader is NOT extracted from a SOURCE ZIP.
      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/Module/spectrumreader

          # Spectrum Reader is authoritative from this directory.
          cp -a Module/spectrumreader/. _site/Module/spectrumreader/

          # Give the repository root a simple landing page so the Pages root
          # does not return 404. It redirects to Spectrum Reader.
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./Module/spectrumreader/">
            <title>EnergyGraphScan</title>
          </head>
          <body>
            <p><a href="./Module/spectrumreader/">Open Spectrum Reader</a></p>
          </body>
          </html>
          EOF

      - name: Verify Spectrum Reader
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "_site/index.html"
            "_site/Module/spectrumreader/index.html"
            "_site/Module/spectrumreader/app.js"
            "_site/Module/spectrumreader/styles.css"
            "_site/Module/spectrumreader/sw.js"
            "_site/Module/spectrumreader/manifest.webmanifest"
            "_site/Module/spectrumreader/core.js"
            "_site/Module/spectrumreader/analysis_core_v2.js"
            "_site/Module/spectrumreader/robust_core_v3.js"
            "_site/Module/spectrumreader/canonical_registration_v4.js"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "Spectrum Reader Pages tree verified."
          find _site/Module/spectrumreader -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
