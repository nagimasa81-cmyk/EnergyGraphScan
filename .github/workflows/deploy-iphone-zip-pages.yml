name: Deploy latest EnergyGraphScan iPhone ZIP to Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "EnergyGraphScan_iPhone_*_SOURCE.zip"
      - ".github/workflows/deploy-iphone-zip-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'EnergyGraphScan_iPhone_*_SOURCE.zip' -printf '%f\n' | sort -V)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No EnergyGraphScan_iPhone_*_SOURCE.zip found in repository root." >&2
            exit 1
          fi
          latest="${zips[-1]}"
          echo "Using: $latest"
          echo "zip=$latest" >> "$GITHUB_OUTPUT"

      - name: Extract site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          unzip -q "${{ steps.source.outputs.zip }}" -d _site

          # Support either root-level site files or a single wrapper folder.
          if [ ! -f _site/index.html ]; then
            mapfile -t indexes < <(find _site -mindepth 2 -maxdepth 2 -type f -name index.html)
            if [ "${#indexes[@]}" -eq 1 ]; then
              wrapper="$(dirname "${indexes[0]}")"
              tmp="$(mktemp -d)"
              cp -a "$wrapper"/. "$tmp"/
              rm -rf _site
              mkdir _site
              cp -a "$tmp"/. _site/
            fi
          fi

          test -f _site/index.html || { echo "index.html was not found after extraction." >&2; exit 1; }
          rm -rf _site/.github
          printf 'Deployed from %s\n' "${{ steps.source.outputs.zip }}" > _site/DEPLOYED_FROM.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
