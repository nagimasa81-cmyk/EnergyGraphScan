name: Build LocAcc PWA
on:
  workflow_dispatch:
  push:
    paths:
      - 'Module/LocAcc/**'
      - '.github/workflows/build_locacc.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest LocAcc source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find Module/LocAcc -maxdepth 1 -type f -iname 'LocAcc*_SOURCE.zip' | sort -V)
          if [ ${#zips[@]} -eq 0 ]; then
            echo 'No Module/LocAcc/LocAcc*_SOURCE.zip found.' >&2
            exit 1
          fi
          ZIP="${zips[-1]}"
          echo "Using: $ZIP"
          mkdir -p _site
          unzip -q "$ZIP" -d _site
          if [ ! -f _site/index.html ]; then
            ROOT=$(find _site -mindepth 1 -maxdepth 2 -type f -name index.html -printf '%h\n' | head -1)
            if [ -n "${ROOT:-}" ]; then
              cp -a "$ROOT"/. _site/
            fi
          fi
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
